<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<title>認証処理</title></head><body>
<p id="status" role="status">Trello公式SDKで認証を処理しています。</p>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="./checklist-pilot-config.js"></script>
<script>
'use strict';
window.addEventListener('load',async()=>{
 const status=document.getElementById('status'),cfg=window.KoyoriChecklistPilotConfig;
 const clear=()=>{try{history.replaceState(null,'',location.pathname);}catch(_){}};
 try{
  if(!cfg||!cfg.configured||new URL(cfg.redirectUri).href!==location.href.split('?')[0].split('#')[0])
   throw Error('CONFIG');
  if(!window.opener||window.opener.closed)throw Error('OPENER');
  const t=window.TrelloPowerUp.iframe({clientId:cfg.clientId,redirectUri:cfg.redirectUri});
  await t.getOAuth2ApiClient().redirectUriCallback();
  status.textContent='認証処理が終了しました。開始画面を確認してください。';
 }catch(_){
  // Never reveal OAuth code, state, fragment, exception message or token.
  status.textContent='認証のコールバックを完了できませんでした。開始画面で確認してください。';
 }finally{clear();}
});
</script></body></html>
