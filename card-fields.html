<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>こより｜タスク項目</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{margin:0;padding:11px;color:#172b4d;background:#fff;font-size:13px;line-height:1.45}
h2{font-size:15px;margin:0 0 3px}p{margin:4px 0}
.hint{color:#626f86;font-size:11px}
.fields{display:grid;gap:9px;margin-top:9px}
.field label{display:block;font-weight:600;font-size:12px;margin-bottom:3px}
.field output{display:block;box-sizing:border-box;width:100%;border:1px solid #dfe1e6;border-radius:5px;background:#f7f8f9;padding:7px 9px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:108px;overflow:auto;min-height:30px}
.field output.missing{color:#626f86}.field output.draft{border-style:dashed}
.bar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
button{border:1px solid #8993a4;background:inherit;color:inherit;border-radius:5px;padding:7px 10px;font-size:12px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
#message{font-size:11px;line-height:1.5;color:#626f86}#message.error{color:#ae2e24}
@media(prefers-color-scheme:dark){body{background:#1d2125;color:#dee4ea}.hint,#message{color:#9fadbc}.field output{background:#282e33;border-color:#454f59}.field output.missing{color:#9fadbc}#message.error{color:#f87462}}
</style></head><body>
<h2>タスク項目</h2>
<p class="hint">詳細説明が唯一の保存先。ここは表示専用です。説明欄またはこよりとの会話から変更してください。</p>
<div class="fields" aria-label="カードのタスク項目">
<div class="field" id="ball-field" hidden><label>ボール</label><output id="ball">読込中…</output></div>
<div class="field"><label>現在地</label><output id="progress">読込中…</output></div>
<div class="field"><label>次の一手</label><output id="nextAction">読込中…</output></div>
<div class="field"><label>次回確認日（期限とは別）</label><output id="reviewDate">読込中…</output></div>
</div>
<div class="bar"><button id="refresh" type="button">説明欄から再読み込み</button><span id="message" role="status" aria-live="polite">読込中…</span></div>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="./view/task-projection-core.js"></script>
<script>
'use strict';
const t=TrelloPowerUp.iframe();
const core=window.KoyoriTaskProjectionCore;
const el=id=>document.getElementById(id);
let request=0;
async function refresh(){
 const sequence=++request;
 el('refresh').disabled=true;
 try{
  const card=await t.card('id','desc');
  if(sequence!==request)return;
  if(!card||typeof card.desc!=='string')throw Error('card description unavailable');
  const data=core.parse(card.desc);
  el('ball-field').hidden=!data.ball;
  el('ball').textContent=data.ball||'未記載';
  for(const key of ['progress','nextAction','reviewDate']){
   const node=el(key);
   node.textContent=data[key]||'未記載';
   node.className=data[key]?(key==='nextAction'&&data.draft?'draft':''):'missing';
  }
  if(data.draft&&data.nextAction)el('nextAction').textContent='［整理案］ '+data.nextAction;
  const problems=[];
  if(data.invalidReviewDate)problems.push('確認日の書式が不正');
  if(data.duplicateFields.length)problems.push('項目の重複：'+
   data.duplicateFields.map(x=>({ball:'ボール',progress:'現在地',nextAction:'次の一手',reviewDate:'次回確認日'})[x]).join('・'));
  el('message').textContent=problems.length?
   '詳細説明の確認が必要（'+problems.join(' / ')+'）。値の自動修正はしていません。':
   '詳細説明の内容を表示しています。';
  el('message').className=problems.length?'error':'';
 }catch(e){
  if(sequence!==request)return;
  el('ball-field').hidden=true;
  for(const key of ['progress','nextAction','reviewDate'])el(key).textContent='取得失敗';
  el('message').textContent='説明欄の読み込みに失敗。カード内容は変更していません。';
  el('message').className='error';
 }finally{
  if(sequence===request)el('refresh').disabled=false;
 }
}
el('refresh').addEventListener('click',refresh);
if(typeof t.render==='function')t.render(refresh);
else refresh();
</script></body></html>
